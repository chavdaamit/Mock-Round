<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Budget Tracker</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <div class="container mt-5">
      <h1 class="text-center mb-5">Budget Tracker</h1>

      <div class="row justify-content-center g-5">
        <div class="col-md-5">
          <div class="card shadow-sm h-100">
            <div class="card-body p-4">
              <form id="budgetForm">
                <h3 class="text-center mb-4">Add Budget</h3>

                <input
                  type="number"
                  id="budgetInput"
                  class="form-control mb-3"
                  placeholder="Enter your budget"
                />

                <div class="text-center">
                  <button type="submit" class="btn btn-primary">
                    Add Budget
                  </button>
                </div>

                <p id="budgetResult" class="mt-3 text-center"></p>
              </form>
            </div>
          </div>
        </div>

        <div class="col-md-5">
          <div class="card shadow-sm h-100">
            <div class="card-body p-4">
              <form id="expenseForm">
                <h3 class="text-center mb-4">Add Expense</h3>

                <input
                  type="text"
                  id="expenseName"
                  class="form-control mb-3"
                  placeholder="Enter expense"
                />

                <input
                  type="number"
                  id="expenseAmount"
                  class="form-control mb-3"
                  placeholder="Enter amount"
                />

                <div class="text-center">
                  <button type="submit" class="btn btn-danger">
                    Add Expense
                  </button>
                </div>

                <p id="expenseResult" class="mt-3 text-center"></p>

                <p id="remainingResult" class="text-center"></p>
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
